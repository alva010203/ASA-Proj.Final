upstream portal {
  server portal_container:80;
}

upstream web02 {
  server web02:80;
}

# Redirecionamento HTTP → HTTPS
server {
    listen 80;
    server_name cliente1.br www.cliente1.br portal.cliente1.br hotsite.cliente1.br;
    return 301 https://$host$request_uri;
}

# Configuração HTTPS principal
server {
    listen 443 ssl;
    server_name cliente1.br www.cliente1.br;

    ssl_certificate /etc/ssl/certs/cliente1.crt;
    ssl_certificate_key /etc/ssl/private/cliente1.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }
}

# Configuração HTTPS para portal
server {
    listen 443 ssl;
    server_name portal.cliente1.br;

    ssl_certificate /etc/ssl/certs/cliente1.crt;
    ssl_certificate_key /etc/ssl/private/cliente1.key;

    location / {
        proxy_pass http://portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Configuração HTTPS para hotsite
server {
    listen 443 ssl;
    server_name hotsite.cliente1.br;

    ssl_certificate /etc/ssl/certs/cliente1.crt;
    ssl_certificate_key /etc/ssl/private/cliente1.key;

    location / {
        proxy_pass http://web02;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
