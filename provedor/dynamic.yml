tls:
  certificates:
    - certFile: "/certs/selfsigned.crt"
      keyFile: "/certs/selfsigned.key"

http:
  routers:
    www-cliente1:
      rule: "Host(`www.cliente1.br`)"
      service: cliente1-proxy
      entryPoints:
        - websecure
      tls: {}

    portal-cliente1:
      rule: "Host(`portal.cliente1.br`)"
      service: cliente1-proxy
      entryPoints:
        - websecure
      tls: {}

    hotsite-cliente1:
      rule: "Host(`hotsite.cliente1.br`)"
      service: cliente1-proxy
      entryPoints:
        - websecure
      tls: {}

    sign-cliente1:
      rule: "Host(`sign.cliente1.br`)"
      service: cliente1-proxy
      entryPoints:
        - websecure
      tls: {}

  services:
    cliente1-proxy:
      loadBalancer:
        servers:

          - url: "http://proxy:80"  
