tls:
  certificates:
    - certFile: "/certs/selfsigned.crt"
      keyFile: "/certs/selfsigned.key"
    - certFile: "/certs/cliente1.crt"    # seu cert autoassinado para cliente1
      keyFile: "/certs/cliente1.key" 
http:
  routers:
    redirect-all:
      entryPoints:
        - web
      rule: "HostRegexp(`{host:.+}`)"     #redireciona todas as requisições HTTP para HTTPS
      middlewares:
        - redirect-to-https
      service: noop 

    www-cliente1:
      rule: "Host(`www.cliente1.br`)"
      service: cliente1-proxy
      entryPoints: 
        - websecure
      tls: {}

    portal-cliente1:
      rule: "Host(`portal.cliente1.br`)"
      service: cliente1-proxy
      entryPoints:
        - websecure
      tls: {}

    hotsite-cliente1:
      rule: "Host(`hotsite.cliente1.br`)"
      service: cliente1-proxy
      entryPoints:
        - websecure
      tls: {}
    
    sign-cliente1:
      rule: "Host(`sign.cliente1.br`)"
      service: cliente1-proxy
      entryPoints:
        - websecure
      tls: {}
      
    www-cliente2:
      rule: "Host(`www.cliente2.br`)"
      service: cliente2-proxy
      entryPoints:
        - websecure
      tls: {}

    portal-cliente2:
      rule: "Host(`portal.cliente2.br`)"
      service: cliente2-proxy
      entryPoints:
        - websecure
      tls: {}

    wordpress-cliente2:
      rule: "Host(`wordpress.cliente2.br`)"
      service: cliente2-proxy
      entryPoints:
        - websecure
      tls: {}
   
    adminer-cliente2:
      rule: "Host(`adminer.cliente2.br`)"
      service: cliente2-proxy
      entryPoints:
        - websecure
      tls: {}

    portal-cliente3:
      rule: "Host(`portal.cliente3.br`)"
      service: cliente3-proxy
      entryPoints:
        - websecure
      tls: {}

    cms-cliente3:
      rule: "Host(`wordpress.cliente3.br`)"
      service: cliente3-proxy
      entryPoints: 
        - websecure
      tls: {}
    
    adminer-cliente3:
      rule: "Host(`adminer.cliente3.br`)"
      service: cliente3-proxy
      entryPoints:
        - websecure
      tls: {}


  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https

  services:
    cliente1-proxy:
      loadBalancer:
        servers:
          - url: "http://proxy:80"
    cliente2-proxy:
      loadBalancer:
        servers:
          - url: "http://apache_proxy:80"
    cliente3-proxy:
      loadBalancer:
        servers:
          - url: "http://haproxy:80"  
    noop:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1"