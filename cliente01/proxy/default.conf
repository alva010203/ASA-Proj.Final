# Upstreams usando os nomes corretos dos containers
upstream portal {
  server portal_container:80;
}

upstream web02 {
  server web02:80;
}

upstream sign {
  server sign-app:80;
}

upstream backend {
  server sign-api:8000;
}

# Roteamento do sistema de assinatura
server {
    listen 80;
    server_name sign.cliente1.br;

    location / {
        proxy_pass http://sign;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Página de boas-vindas do domínio principal
server {
    listen 80;
    server_name cliente1.br www.cliente1.br;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
    }
}

# Roteamento para o sistema Portal
server {
    listen 80;
    server_name portal.cliente1.br;

    location / {
        proxy_pass http://portal;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
