
services:
  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: portal_container 
    networks:
      - interna

  web02:
    build:
      context: ./web02
      dockerfile: Dockerfile
    container_name: web02 
    networks:
      - interna

  proxy:
    build: 
      context: ./proxy

      dockerfile: Dockerfile  

    networks:
      - interna
      - externa
    depends_on:
      - db
      - backend
      - frontend
  ### Banco de Dados (PostgreSQL) ###
  db:
    image: postgres:15-alpine
    container_name: sign-db
    environment:
      POSTGRES_USER: ${DB_USER:-dbuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dbuserpass123}
      POSTGRES_DB: ${DB_NAME:-docsign_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-dbuser} -d ${DB_NAME:-docsign_db}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - interna

  ### Backend/API ###
  backend:
    image: salesfilho/sign-api:latest
    container_name: sign-api
    platform: linux/arm64
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-dbuser}
      DB_PASSWORD: ${DB_PASSWORD:-dbuserpass123}
      DB_NAME: ${DB_NAME:-docsign_db}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://backend:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - interna

  ### Frontend / App ###
  frontend:
    image: salesfilho/sign-app:latest
    container_name: sign-app
    platform: linux/arm64
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - interna

volumes:
  postgres_data:

networks:
  interna:              
    driver: bridge        
  externa:
    external: true

